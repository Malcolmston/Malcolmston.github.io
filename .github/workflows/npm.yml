name: yarn

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: lint, check, verify, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Check
        run: yarn check

      - name: Verify
        run: yarn verify

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Test
        run: yarn test
